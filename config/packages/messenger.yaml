framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            # Ajoutez cette section pour les échecs
            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            #'Symfony\Component\Mailer\Messenger\SendEmailMessage': async